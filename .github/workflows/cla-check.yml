name: CLA check
# A pull request is blocked until its author's GitHub login is in cla/SIGNATURES.tsv on the BASE
# branch (pull_request_target checks out the base, so a PR cannot sign itself). No third-party
# CLA action: the contributor-assistant action was archived in March 2026. Bash only.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The author has a signed CLA on file
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -u
          if awk -F'\t' -v a="$AUTHOR" '!/^#/ && $1 == a { found = 1 } END { exit !found }' cla/SIGNATURES.tsv; then
            echo "CLA on file for $AUTHOR"
            exit 0
          fi
          gh pr comment "$PR" --body "Thanks @$AUTHOR. Before this can be merged we need a signed Contributor Licence Agreement on file — see CLA.md (Harmony CLA v1.0, licence variant, Option Five, England and Wales). Sign cla/ha-cla-i.pdf (individual) or cla/ha-cla-e.pdf (entity) and email it to tony.gair@thedarkfactory.co.uk. We add your GitHub login to cla/SIGNATURES.tsv and this check goes green. You keep your copyright; your contribution stays AGPL." || true
          echo "No CLA on file for $AUTHOR - see CLA.md"
          exit 1
