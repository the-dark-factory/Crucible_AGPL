name: CLA check
# A pull request is blocked until its author's GitHub login is in cla/SIGNATURES.tsv on the BASE
# branch (pull_request_target checks out the base, so a PR cannot sign itself). No third-party
# CLA action: the contributor-assistant action was archived in March 2026. Bash only.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The author has a signed CLA on file
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -u
          if awk -F'\t' -v a="$AUTHOR" '!/^#/ && $1 == a { found = 1 } END { exit !found }' cla/SIGNATURES.tsv; then
            echo "CLA on file for $AUTHOR"
            exit 0
          fi
          gh pr comment "$PR" --body "Thanks @$AUTHOR. Before this can be merged we need a signed Contributor Licence Agreement on file. **Read [cla/CLA-individual.md](../blob/main/cla/CLA-individual.md)** if you own the copyright in the whole of your contribution, or **[cla/CLA-entity.md](../blob/main/cla/CLA-entity.md)** if your employer or company owns it — those are the agreements with our details already filled in, so you read them as they actually bind. (The unmodified Harmony originals are cla/ha-cla-i.pdf and cla/ha-cla-e.pdf, and they govern if the two ever disagree.) To sign: print, sign and scan the one that applies, or reply to it in writing, and email it to tony.gair@thedarkfactory.co.uk. We add your GitHub login to cla/SIGNATURES.tsv and this check goes green. It is the Harmony CLA v1.0, licence variant, Outbound Option Five, England and Wales — a licence, not an assignment: **you keep your copyright, and your contribution stays AGPL**. See CLA.md for what each clause was filled with and why." || true
          echo "No CLA on file for $AUTHOR - see CLA.md"
          exit 1
